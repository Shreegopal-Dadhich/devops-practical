---
# Default Deny - nothing in this namespace can send or receive traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gainserv-default-deny
  namespace: gainserv
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Allow DNS - every pod may resolve names through CoreDNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gainserv-allow-dns
  namespace: gainserv
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
