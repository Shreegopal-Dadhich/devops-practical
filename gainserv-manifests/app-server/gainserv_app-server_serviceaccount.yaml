---
# App Server ServiceAccount (IRSA)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gainserv-app-server-prod-sa
  namespace: gainserv
  labels:
    app: gainserv-app-server-prod
  annotations:
    eks.amazonaws.com/role-arn: ${APP_ROLE_ARN}
# App never calls the Kubernetes API - no Kubernetes token mounted
automountServiceAccountToken: false

---
# Secrets Reader ServiceAccount (IRSA)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gainserv-app-server-prod-secrets-reader-sa
  namespace: gainserv
  labels:
    app: gainserv-app-server-prod
  annotations:
    eks.amazonaws.com/role-arn: ${SECRETS_READER_ROLE_ARN}
automountServiceAccountToken: false
