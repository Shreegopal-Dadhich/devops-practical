---
# Horizontal Pod Autoscaler for App Server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gainserv-app-server-prod-hpa
  namespace: gainserv
  labels:
    app: gainserv-app-server-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gainserv-app-server-prod
  # 2 = one pod can die (node drain, Spot reclaim) without an outage
  minReplicas: 2
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    # Scale down slowly - wait 5 min, then max 2 pods per minute
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    # Scale up fast - double or +4 pods every 30s, whichever is more
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
