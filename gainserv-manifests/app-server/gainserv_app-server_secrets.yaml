---
# App Server ConfigMap (non-secret env)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gainserv-app-server-prod-env-config
  namespace: gainserv
  labels:
    app: gainserv-app-server-prod
data:
  NODE_ENV: "production"
  PORT: "3000"
  AWS_REGION: "${AWS_REGION}"
  APP_DATA_BUCKET: "${APP_DATA_BUCKET}"

---
# SecretStore - where secrets come from (SSM Parameter Store)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gainserv-app-server-prod-ssm-store
  namespace: gainserv
  labels:
    app: gainserv-app-server-prod
spec:
  provider:
    aws:
      service: ParameterStore
      region: ${AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: gainserv-app-server-prod-secrets-reader-sa

---
# ExternalSecret - creates the Kubernetes Secret from SSM
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gainserv-app-server-prod-env-secret
  namespace: gainserv
  labels:
    app: gainserv-app-server-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gainserv-app-server-prod-ssm-store
    kind: SecretStore
  target:
    name: gainserv-app-server-prod-env-secret
    creationPolicy: Owner
  data:
  - secretKey: APP_API_KEY
    remoteRef:
      key: ${SSM_PREFIX}/APP_API_KEY
